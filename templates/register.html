{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-dark text-white mt-5">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Create Account</h4>

                <!-- Flash messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Create Account</button>
                </form>

                <p class="text-center mt-3">Already have an account? <a href="/login" class="text-success">Login here</a></p>

            </div>
        </div>
    </div>
</div>

{% endblock %}
