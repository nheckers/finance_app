{% extends "base.html" %}

{% block content %}

<h4>Add Transaction</h4>
<form method="POST">
    <!-- Description -->
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control" name="description" placeholder="e.g. Grocery Shopping" required>
    </div>

    <!-- Amount -->
    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" class="form-control" name="amount" placeholder="e.g. 50.00" step="0.01" required>
    </div>

    <!-- Category -->
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" name="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Income">Income</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success w-100">Add Transaction</button>
    <a href="/" class="btn btn-secondary w-100 mt-2">Cancel</a>
</form>

{% endblock %}
